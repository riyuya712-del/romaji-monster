<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ローマ字モンスター</title><style>body{font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f7f8fc;color:#334}.loading{text-align:center;font-weight:800;padding:24px}.bar{width:min(70vw,360px);height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:#667eea}</style></head><body><div class="loading">ローマ字モンスターを よみこんでいます…<div class="bar"><div class="fill" id="fill"></div></div></div><script>(async()=>{const n=13,r=[];try{for(let i=1;i<=n;i++){const f=`part${String(i).padStart(2,'0')}.txt`,x=await fetch(f,{cache:'no-store'});if(!x.ok)throw Error(f);r.push(await x.text());document.getElementById('fill').style.width=`${i/n*100}%`}document.open();document.write(r.join(''));document.close()}catch(e){document.body.innerHTML='<div style="padding:24px;font-family:sans-serif"><h2>よみこみに失敗しました</h2><p>ページをもう一度読みこんでください。</p></div>';console.error(e)}})();</script></body></html>
